@for (group of groups(); track group.key) {
  <section class="mb-8 last:mb-0" [attr.aria-label]="group.label">
    <h3
      class="mb-3 flex items-baseline gap-2 border-b border-border pb-1.5 text-xs font-semibold tracking-wide text-text-muted uppercase"
    >
      {{ group.label }}
      <span class="font-normal tabular-nums">{{ group.count }}</span>
    </h3>

    <ul class="grid grid-cols-[repeat(auto-fill,minmax(9.75rem,1fr))] gap-3">
      @for (card of group.cards; track card.id) {
        @let issue = cardIssues().get(card.id);
        <li class="group/card relative">
          <button
            type="button"
            (click)="inspect.emit(card)"
            [attr.aria-label]="
              card.quantity + ' × ' + card.name + (issue ? ' (' + issue + ')' : '')
            "
            class="block w-full rounded-[4.75%/3.4%] outline-none transition duration-150 hover:-translate-y-0.5 hover:shadow-lg hover:shadow-black/40 focus-visible:ring-2 focus-visible:ring-cyan motion-reduce:transition-none light:hover:shadow-black/15"
            [class.ring-2]="!!issue"
            [class.ring-purple]="!!issue"
          >
            <app-card-image
              [src]="card.imageUrl"
              [name]="card.name"
              [typeLine]="card.typeLine"
              decorative
            />
          </button>

          <span
            class="pointer-events-none absolute top-[11%] left-0 rounded-r-md bg-bg/90 py-0.5 pr-2 pl-1.5 text-sm font-bold tabular-nums text-text shadow backdrop-blur-sm"
            aria-hidden="true"
          >
            <span class="text-xs font-medium text-text-muted">×</span>{{ card.quantity }}
          </span>

          @if (issue) {
            <span
              class="absolute top-[11%] right-1.5 flex h-6 w-6 items-center justify-center rounded-full bg-purple text-white shadow"
              [title]="issue"
            >
              <svg lucideTriangleAlert [size]="13" />
            </span>
          }

          @if (canEdit()) {
            <div
              class="absolute inset-x-0 bottom-2 flex justify-center opacity-0 transition-opacity group-focus-within/card:opacity-100 group-hover/card:opacity-100 pointer-coarse:hidden"
            >
              <app-quantity-stepper
                [value]="card.quantity"
                [name]="card.name"
                size="sm"
                (changed)="step(card, $event)"
                class="shadow-lg shadow-black/40"
              />
            </div>
          }
        </li>
      }
    </ul>
  </section>
}
