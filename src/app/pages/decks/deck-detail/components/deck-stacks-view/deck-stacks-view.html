<div class="flex flex-wrap gap-x-5 gap-y-8">
  @for (group of groups(); track group.key) {
    <section
      class="w-[calc(50%-0.625rem)] sm:w-auto sm:min-w-40 sm:max-w-56 sm:flex-1"
      [attr.aria-label]="group.label"
    >
      <h3 class="mb-2 flex items-baseline gap-1.5 truncate text-xs font-semibold text-text">
        <span class="truncate">{{ group.label }}</span>
        <span class="font-normal tabular-nums text-text-muted">{{ group.count }}</span>
      </h3>

      <!--
        Each card after the first pulls up by 124% of the column width (margins
        resolve against width): a card is ~140% as tall as it is wide, so ~16%
        of it, the title bar, stays in view.
      -->
      <ul class="pb-1">
        @for (card of group.cards; track card.id) {
          @let issue = cardIssues().get(card.id);
          <li class="relative not-first:-mt-[124%] hover:z-20 focus-within:z-20">
            <button
              type="button"
              (click)="inspect.emit(card)"
              [attr.aria-label]="
                card.quantity + ' × ' + card.name + (issue ? ' (' + issue + ')' : '')
              "
              class="block w-full rounded-[4.75%/3.4%] shadow-[0_-1px_6px_rgb(0_0_0/0.35)] outline-none transition-transform duration-150 hover:-translate-y-1.5 focus-visible:-translate-y-1.5 focus-visible:ring-2 focus-visible:ring-cyan motion-reduce:transition-none light:shadow-[0_-1px_4px_rgb(46_53_74/0.18)]"
            >
              <app-card-image
                [src]="thumbnail(card.imageUrl)"
                [name]="card.name"
                [typeLine]="card.typeLine"
                decorative
              />
            </button>
            <!-- A ring would frame the whole overlapped pile, so problems get a badge on the title bar. -->
            @if (issue) {
              <span
                class="pointer-events-none absolute top-[2.5%] -right-1.5 z-10 flex h-[18px] w-[18px] items-center justify-center rounded-full bg-purple text-white shadow ring-1 ring-bg"
                [title]="issue"
              >
                <svg lucideTriangleAlert [size]="11" />
              </span>
            }
            @if (card.quantity > 1) {
              <span
                class="pointer-events-none absolute top-[3%] -left-1.5 z-10 rounded-full bg-bg px-1.5 py-px text-[11px] font-bold tabular-nums text-text shadow ring-1 ring-border"
                aria-hidden="true"
              >
                {{ card.quantity }}
              </span>
            }
          </li>
        }
      </ul>
    </section>
  }
</div>
