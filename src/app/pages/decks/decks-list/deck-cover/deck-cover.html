@let isMtg = deck().game === 'mtg';
<div class="relative h-28 overflow-hidden bg-bg" aria-hidden="true">
  @if (loading()) {
    <div class="h-full w-full animate-pulse bg-border"></div>
  } @else if (imageUrl(); as url) {
    <img
      [src]="url"
      alt=""
      loading="lazy"
      decoding="async"
      (error)="onImageError()"
      class="h-full w-full object-cover object-[center_20%]"
    />
    <!-- Fades the art into the card body below. -->
    <div class="absolute inset-0 bg-linear-to-t from-surface/80 via-transparent to-transparent"></div>
  } @else {
    <!-- No card with an image yet: a tinted backdrop in the game's color. -->
    <div
      class="flex h-full w-full items-center justify-center bg-linear-to-br"
      [class]="isMtg ? 'from-purple/30 to-purple/5 text-purple/60' : 'from-cyan/30 to-cyan/5 text-cyan/60'"
    >
      <svg class="h-10 w-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="7" y="3" width="12" height="16" rx="1.5" />
        <path d="M5 6.5v12A2.5 2.5 0 0 0 7.5 21H15" stroke-linecap="round" />
      </svg>
    </div>
  }

  <!-- Game accent along the top edge. -->
  <div class="absolute inset-x-0 top-0 h-1" [class]="isMtg ? 'bg-purple' : 'bg-cyan'"></div>
</div>
