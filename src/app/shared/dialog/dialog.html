<dialog
  #dialog
  (close)="closed.emit()"
  (click)="onClick($event)"
  [attr.aria-labelledby]="titleId"
  class="m-auto max-h-[calc(100dvh-2rem)] w-[calc(100%-2rem)] overflow-hidden rounded-xl border border-border bg-surface p-0 text-text shadow-2xl shadow-black/50 backdrop:bg-bg/75 backdrop:backdrop-blur-[2px] light:shadow-black/15"
  [class]="widthClass()"
>
  <div class="flex max-h-[calc(100dvh-2rem)] flex-col">
    <header class="flex items-start justify-between gap-4 border-b border-border px-5 py-4">
      <div class="min-w-0">
        <h2 [id]="titleId" class="truncate text-base font-semibold text-text">{{ title() }}</h2>
        @if (subtitle(); as subtitle) {
          <p class="mt-0.5 truncate text-xs text-text-muted">{{ subtitle }}</p>
        }
      </div>
      <button
        type="button"
        (click)="close()"
        aria-label="Fechar"
        class="-mr-1.5 flex h-8 w-8 shrink-0 items-center justify-center rounded-md text-text-muted outline-none transition-colors hover:bg-bg hover:text-text focus-visible:ring-2 focus-visible:ring-cyan"
      >
        <svg lucideX [size]="18" />
      </button>
    </header>

    <div class="min-h-0 flex-1 overflow-y-auto px-5 py-4">
      <ng-content />
    </div>

    <footer
      class="flex flex-wrap items-center justify-end gap-2 border-t border-border px-5 py-3 empty:hidden"
    >
      <ng-content select="[dialogFooter]" />
    </footer>
  </div>
</dialog>
